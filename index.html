<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Robot Wiki</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        🤖 Robot Wiki
    </div>

    <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Cerca..."
    >

</header>


<main class="container">


    <!-- =================================
         HOME
    ================================== -->

    <section id="homeView">

        <div class="hero">

            <div class="hero-icon">
                🤖
            </div>

            <div>

                <h1>
                    Robot Wiki
                </h1>

                <p>
                    Documentazione, robot e guide
                    tecniche.
                </p>

            </div>

        </div>


        <div class="page-title">

            <h2>
                Marche
            </h2>

            <p>
                Seleziona un produttore.
            </p>

        </div>


        <div
            id="brandsGrid"
            class="brands-grid"
        >

            <div class="loading">
                Caricamento marche...
            </div>

        </div>

    </section>



    <!-- =================================
         MARCA
    ================================== -->

    <section
        id="brandView"
        class="hidden"
    >

        <button
            id="backToBrands"
            class="back-button"
        >
            ← Marche
        </button>


        <div class="brand-header">

            <div
                id="brandIcon"
                class="brand-icon-big"
            >
                🤖
            </div>


            <div>

                <h1 id="brandName">
                    FANUC
                </h1>

                <p id="brandDescription">
                </p>

            </div>

        </div>



        <!-- ROBOT -->

        <section class="content-section">

            <div class="section-title">

                <h2>
                    🤖 Robot
                </h2>

                <p>
                    Modelli con cui ho avuto
                    a che fare.
                </p>

            </div>


            <div
                id="robotsGrid"
                class="robots-grid"
            >

            </div>

        </section>



        <!-- GUIDE -->

        <section class="content-section">

            <div class="section-title">

                <h2>
                    📚 Guide
                </h2>

                <p>
                    Documentazione divisa per
                    argomento.
                </p>

            </div>


            <div
                id="guidesGrid"
                class="guides-grid"
            >

            </div>

        </section>

    </section>



    <!-- =================================
         ROBOT
    ================================== -->

    <section
        id="robotView"
        class="hidden"
    >

        <button
            id="backToBrandFromRobot"
            class="back-button"
        >
            ← Torna alla marca
        </button>


        <div class="robot-page">


            <div class="robot-image-container">

                <img
                    id="robotImage"
                    src=""
                    alt=""
                >

                <div
                    id="robotImagePlaceholder"
                    class="image-placeholder"
                >
                    🤖
                </div>

            </div>



            <div class="robot-info">

                <span class="label">
                    MODELLO
                </span>


                <h1 id="robotName">
                </h1>


                <p id="robotDescription">
                    Documentazione del robot.
                </p>


                <div
                    id="robotFiles"
                    class="robot-actions"
                >

                </div>

            </div>

        </div>


        <article
            id="robotMarkdown"
            class="markdown-content"
        >

        </article>

    </section>



    <!-- =================================
         GUIDA
    ================================== -->

    <section
        id="guideView"
        class="hidden"
    >

        <button
            id="backToBrandFromGuide"
            class="back-button"
        >
            ← Torna alla marca
        </button>


        <div class="guide-header">

            <span
                id="guideBrand"
                class="guide-category"
            >
            </span>


            <h1 id="guideTitle">
            </h1>

        </div>


        <article
            id="guideMarkdown"
            class="markdown-content"
        >

        </article>

    </section>


</main>


<footer>

    Robot Wiki

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
></script>


<script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualizzatore PDF</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>

</head>

<body>

    <iframe id="pdfViewer"></iframe>

    <script>

        const params =
            new URLSearchParams(window.location.search);

        const file =
            params.get("file");

        if (file) {

            document.getElementById("pdfViewer").src =
                file;

        } else {

            document.body.innerHTML =
                "<p style='color:white;padding:20px'>PDF non trovato.</p>";

        }

    </script>

</body>

</html>
